[build]
  command = "npm run build"
  publish = "out"

# Explicitly handle ebook landing pages first
[[redirects]]
  from = "/LP/*"
  to = "/404.html"
  status = 200

[[redirects]]
  from = "/EbookLanding/*"
  to = "/404.html"
  status = 200

# SPA fallback - let Next.js handle routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

